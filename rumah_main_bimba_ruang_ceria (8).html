<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumah Main Bimba Ruang Ceria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8fc;
  --card: #fffdf9;
  --tx: #47284e;
  --mut: #876391;
  --bd: #ffb8d9;
  --bd-soft: #ffe0ef;
  --pri: #ff4d94;
  --pri-sh: #d6296e;
  --sky-top: #bceaff;
  --sky-mid: #ffe8f3;
  --sky-bot: #fff6dc;
  --dot: rgba(255, 133, 185, 0.16);
  --hill-1: #9be8b8;
  --hill-2: #75d99d;
  --grass: #58c984;
  --shadow-soft: 0 10px 24px rgba(173, 86, 134, 0.14);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #321d3b;
    --card: #3f264a;
    --tx: #fff3fa;
    --mut: #dfb8e8;
    --bd: #7d478c;
    --bd-soft: #593166;
    --sky-top: #261a3d;
    --sky-mid: #3b224a;
    --sky-bot: #4a2848;
    --dot: rgba(255, 180, 220, 0.08);
    --hill-1: #2a5948;
    --hill-2: #214a3b;
    --grass: #193b2f;
    --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme="dark"] {
  --bg: #321d3b;
  --card: #3f264a;
  --tx: #fff3fa;
  --mut: #dfb8e8;
  --bd: #7d478c;
  --bd-soft: #593166;
  --sky-top: #261a3d;
  --sky-mid: #3b224a;
  --sky-bot: #4a2848;
  --dot: rgba(255, 180, 220, 0.08);
  --hill-1: #2a5948;
  --hill-2: #214a3b;
  --grass: #193b2f;
  --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  background-color: var(--sky-mid);
  background-image:
    radial-gradient(var(--dot) 3px, transparent 3px),
    radial-gradient(var(--dot) 2px, transparent 2px),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bot) 100%);
  background-size: 36px 36px, 36px 36px, 100% 100%;
  background-position: 0 0, 18px 18px, 0 0;
  background-attachment: fixed;
  color: var(--tx);
  font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 14px;
  overflow-x: hidden;
}

.scenery {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.scenery-sky {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 320px;
}

.sun-spin {
  transform-origin: 86px 76px;
  animation: sunRotate 28s linear infinite;
}

@keyframes sunRotate {
  to { transform: rotate(360deg); }
}

.cloud-drift-1 {
  animation: cloudMove 34s ease-in-out infinite alternate;
}

.cloud-drift-2 {
  animation: cloudMove 42s ease-in-out infinite alternate-reverse;
}

@keyframes cloudMove {
  from { transform: translateX(-18px); }
  to { transform: translateX(24px); }
}

.scenery-ground {
  position: absolute;
  bottom: 0;
  left: -4%;
  width: 108%;
  height: 155px;
}

.wrap {
  width: 100%;
  max-width: 520px;
  position: relative;
  z-index: 2;
  padding-bottom: 105px;
}

.brand {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  font-size: 19px;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, #ff549c 0%, #ff85bc 48%, #ffae42 100%);
  border: 4px solid #fff;
  border-radius: 28px;
  padding: 10px 54px 10px 16px;
  margin-bottom: 14px;
  box-shadow: 0 6px 0 #d93b7e, var(--shadow-soft);
  text-shadow: 0 2px 0 rgba(168, 28, 86, 0.35);
  letter-spacing: 0.3px;
  cursor: pointer;
}

.brand::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 14px;
  right: 52px;
  height: 8px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
  pointer-events: none;
}

.bgm-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffe066 0%, #ffae42 100%);
  color: #5c3106;
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 0 #c97a16;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 3;
  padding: 0;
}

.bgm-btn.playing {
  animation: noteBounce 0.9s ease-in-out infinite alternate;
}

.bgm-btn.muted {
  background: linear-gradient(180deg, #f3e6f5 0%, #d8c2dc 100%);
  box-shadow: 0 3px 0 #9e82a3;
  opacity: 0.9;
}

.bgm-btn:active {
  transform: translateY(-50%) scale(0.9);
}

@keyframes noteBounce {
  from { transform: translateY(-50%) rotate(-8deg) scale(1); }
  to { transform: translateY(-54%) rotate(8deg) scale(1.08); }
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mas {
  width: 104px;
  height: 112px;
  border: 0;
  background: none;
  border-radius: 0;
  font-size: 0;
  cursor: pointer;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: bob 2.2s ease-in-out infinite;
  filter: drop-shadow(0 6px 8px rgba(155, 67, 114, 0.22));
}

.mas.wig {
  animation: wig 0.5s;
}

.bub {
  background: var(--card);
  border: 4px solid var(--bd);
  border-radius: 24px;
  padding: 12px 16px;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.35;
  position: relative;
  flex: 1;
  box-shadow: 0 5px 0 var(--bd-soft), var(--shadow-soft);
}

.bub::before {
  content: "";
  position: absolute;
  left: -15px;
  top: 30px;
  border: 9px solid transparent;
  border-right-color: var(--bd);
  border-left: 0;
}

.bub::after {
  content: "";
  position: absolute;
  left: -9px;
  top: 32px;
  border: 7px solid transparent;
  border-right-color: var(--card);
  border-left: 0;
}

@keyframes bob {
  50% { transform: translateY(-7px); }
}

@keyframes wig {
  25% { transform: rotate(-12deg) scale(1.12); }
  75% { transform: rotate(12deg) scale(1.12); }
}

.box {
  position: relative;
  background: var(--card);
  border: 4px solid var(--bd);
  border-radius: 30px;
  padding: 20px;
  margin-top: 14px;
  box-shadow: 0 8px 0 var(--bd-soft), var(--shadow-soft);
}

.box::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 2.5px dashed var(--bd-soft);
  border-radius: 22px;
  pointer-events: none;
}

.box > * {
  position: relative;
  z-index: 1;
}

input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 20px;
  border: 3px solid var(--bd);
  background: var(--bg);
  color: var(--tx);
  font: inherit;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
  box-shadow: inset 0 3px 6px rgba(180, 90, 140, 0.08);
  outline: none;
  transition: border-color 0.2s, transform 0.2s;
}

input:focus {
  border-color: var(--pri);
  transform: scale(1.01);
}

.go {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding: 15px 18px;
  border: 3px solid rgba(255, 255, 255, 0.65);
  border-radius: 24px;
  background: linear-gradient(180deg, #ff6aa6 0%, var(--pri) 100%);
  color: #fff;
  font: inherit;
  font-size: 22px;
  font-weight: 800;
  box-shadow: 0 6px 0 var(--pri-sh), 0 10px 18px rgba(255, 77, 148, 0.28);
  margin-top: 8px;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
}

.go::after,
.opt::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 12px;
  width: 34px;
  height: 8px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.5);
  pointer-events: none;
}

.go:hover {
  transform: translateY(-2px) scale(1.015);
}

.go:active {
  transform: translateY(4px) scale(0.98);
  box-shadow: 0 2px 0 var(--pri-sh);
}

.ages {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
  margin-bottom: 12px;
}

.ages button {
  position: relative;
  border: 3px solid var(--bd);
  background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
  color: var(--tx);
  border-radius: 20px;
  padding: 9px 2px;
  font: inherit;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  line-height: 1.15;
  box-shadow: 0 4px 0 var(--bd-soft);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s;
}

.ages button:hover {
  transform: translateY(-2px);
}

.ages button.on {
  background: linear-gradient(180deg, #ff70ab 0%, var(--pri) 100%);
  color: #fff;
  border-color: #fff;
  box-shadow: 0 5px 0 var(--pri-sh);
  transform: translateY(-3px) scale(1.06);
}

.ages b {
  display: block;
  font-size: 26px;
}

.bar {
  height: 20px;
  background: var(--card);
  border: 3px solid var(--bd);
  border-radius: 14px;
  overflow: hidden;
  flex: 1;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
}

.bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--c), #ffd43b);
  width: 0;
  transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-radius: 10px;
}

.bk {
  border: 3px solid #fff;
  background: linear-gradient(180deg, #ffe2f0 0%, var(--bd) 100%);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(168, 72, 120, 0.25);
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  flex: none;
}

.bk:active {
  transform: translateY(3px) scale(0.95);
}

.vis {
  font-size: 68px;
  text-align: center;
  margin: 14px 0 6px;
  line-height: 1.2;
  word-break: break-word;
  background: var(--bg);
  border: 3px dashed var(--bd-soft);
  border-radius: 22px;
  padding: 12px 8px;
}

.q {
  font-size: 23px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 14px;
}

.sp {
  border: 2px solid #fff;
  background: linear-gradient(180deg, #ffe3f1, var(--bd));
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 21px;
  cursor: pointer;
  margin-left: 6px;
  box-shadow: 0 3px 0 rgba(168, 72, 120, 0.2);
  transition: transform 0.15s;
}

.sp:active {
  transform: scale(0.92);
}

.opts {
  display: grid;
  gap: 12px;
}

.opt {
  position: relative;
  overflow: hidden;
  padding: 15px 16px;
  border: 3px solid rgba(255, 255, 255, 0.65);
  border-radius: 24px;
  background: var(--c);
  color: #fff;
  font: inherit;
  font-size: 27px;
  font-weight: 800;
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}

.opt:hover {
  transform: translateY(-2px) scale(1.015);
}

.opt:active {
  transform: translateY(4px) scale(0.98);
}

.opt.ar {
  font-size: 44px;
  line-height: 1.3;
}

.opt.ok {
  background: linear-gradient(180deg, #43d98e 0%, #22a866 100%) !important;
  transform: scale(1.05);
}

.opt.no {
  background: linear-gradient(180deg, #ff7075 0%, #e03e44 100%) !important;
  opacity: 0.85;
}

.res {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 10px;
  margin-bottom: 8px;
  background: var(--bg);
  border: 2.5px solid var(--bd-soft);
  border-radius: 20px;
  font-size: 19px;
  font-weight: 800;
}

.res em {
  font-style: normal;
  margin-left: auto;
  background: var(--c);
  color: #fff;
  border: 2px solid #fff;
  border-radius: 16px;
  padding: 3px 16px;
  font-size: 25px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
}

.mut {
  color: var(--mut);
  font-size: 15px;
  font-weight: 700;
}

.lad {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
}

.lad span {
  padding: 4px 14px;
  border-radius: 14px;
  background: var(--bd-soft);
  font-weight: 800;
  font-size: 16px;
  transition: 0.2s;
}

.lad .on {
  background: var(--c);
  color: #fff;
  border: 2px solid #fff;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
}

.lad .st {
  margin-left: auto;
  background: #fff3bf;
  color: #8f5b00;
  border: 2px solid #ffd43b;
}

.zones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}

.zone {
  min-height: 98px;
  border: 4px dashed var(--c);
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 800;
  background: var(--bg);
  transition: transform 0.2s, background 0.25s;
}

.zone.ok {
  border-style: solid;
  border-color: #2bb673;
  background: #d8f7e3;
  color: #2b2540;
  transform: scale(1.03);
}

.tray {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  padding: 14px;
  border-radius: 24px;
  background: var(--bd-soft);
  border: 3px dashed var(--bd);
  min-height: 92px;
}

.drag {
  font-size: 44px;
  background: var(--card);
  border: 3px solid #fff;
  border-radius: 22px;
  padding: 6px 16px;
  box-shadow: 0 6px 0 rgba(168, 72, 120, 0.22);
  cursor: grab;
  touch-action: none;
  user-select: none;
  animation: bob 2.2s ease-in-out infinite;
  position: relative;
  transition: transform 0.25s;
}

.drag.up {
  z-index: 50;
  animation: none;
  cursor: grabbing;
}

.drag.placed {
  animation: none;
  box-shadow: none;
  border: 0;
  background: transparent;
  padding: 0;
  font-size: 38px;
}

.hide {
  display: none !important;
}

.map {
  position: relative;
  height: 540px;
  border-radius: 32px;
  border: 5px solid #fff;
  outline: 4px solid var(--bd);
  overflow: hidden;
  background: linear-gradient(180deg, #b8f1ff 0%, #dafad4 24%, #9ae89e 68%, #7ed684 100%);
  margin-top: 14px;
  box-shadow: var(--shadow-soft);
}

.map > svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.nd {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe8a3 0%, #f5b953 60%, #d98c2b 100%);
  border: 4px solid #fff;
  outline: 4px solid #b56d1b;
  color: #5c3106;
  font: inherit;
  font-weight: 800;
  font-size: 30px;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 7px 0 #9c5911, 0 10px 16px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  padding: 2px;
  z-index: 2;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.nd small {
  font-size: 10.5px;
  line-height: 1.05;
  font-weight: 800;
  margin-top: 2px;
  max-width: 68px;
  color: #4a2502;
}

.nd.cur {
  animation: pulse 0.85s ease-in-out infinite alternate;
  background: radial-gradient(circle at 35% 30%, #ff9ec7 0%, #ff4f9a 70%, #d6296e 100%);
  outline-color: #ff4f9a;
  color: #fff;
  box-shadow: 0 7px 0 #b81d5c, 0 0 0 8px rgba(255, 79, 154, 0.28);
}

.nd.cur small {
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

.nd.dn {
  background: radial-gradient(circle at 35% 30%, #98f5be 0%, #2dc97a 70%, #199c58 100%);
  outline-color: #16854b;
  color: #fff;
  box-shadow: 0 7px 0 #12703f;
}

.nd.dn small {
  color: #fff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

.nd.lock {
  filter: saturate(0.55) brightness(0.95);
  opacity: 0.88;
}

@keyframes pulse {
  to { transform: translate(-50%, -50%) scale(1.14); }
}

.pm {
  position: absolute;
  width: 64px;
  transform: translate(-50%, -92%);
  transition: left 0.9s, top 0.9s cubic-bezier(0.3, 1.5, 0.5, 1);
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.25));
}

.mini {
  width: 46px;
  display: block;
}

.rwd {
  width: 175px;
  margin: 8px auto;
  animation: bob 1.6s ease-in-out infinite;
  filter: drop-shadow(0 8px 12px rgba(255, 79, 154, 0.25));
}

.an {
  position: absolute;
  font-size: 28px;
  z-index: 1;
  animation: walk var(--t, 18s) linear infinite;
  animation-delay: var(--dl, 0s);
  pointer-events: none;
}

.an i {
  display: block;
  font-style: normal;
  animation: hop 0.6s ease-in-out infinite;
}

@keyframes walk {
  from { left: -12%; }
  to { left: 106%; }
}

@keyframes hop {
  0%, 100% { transform: scaleX(-1) translateY(0); }
  50% { transform: scaleX(-1) translateY(-8px); }
}

svg.m {
  width: 100%;
  display: block;
  overflow: visible;
}

.mo {
  transform-box: fill-box;
  transform-origin: center;
}

.talk .mo {
  animation: mo 0.18s infinite alternate;
}

@keyframes mo {
  to { transform: scaleY(2.8) scaleX(0.9); }
}

.ey {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 4s infinite;
}

@keyframes blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}

.pm svg {
  animation: bob 1s ease-in-out infinite;
}

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>

<div class="scenery" aria-hidden="true">
  <svg class="scenery-sky" viewBox="0 0 800 320" preserveAspectRatio="xMidYMin slice">
    <g transform="translate(460, 220)">
      <path d="M-240,0 A240,210 0 0,1 240,0" fill="none" stroke="#ff94c2" stroke-width="18" stroke-opacity="0.35"/>
      <path d="M-222,0 A222,192 0 0,1 222,0" fill="none" stroke="#ffcf70" stroke-width="18" stroke-opacity="0.35"/>
      <path d="M-204,0 A204,174 0 0,1 204,0" fill="none" stroke="#fff380" stroke-width="18" stroke-opacity="0.38"/>
      <path d="M-186,0 A186,156 0 0,1 186,0" fill="none" stroke="#8ce8b3" stroke-width="18" stroke-opacity="0.35"/>
      <path d="M-168,0 A168,138 0 0,1 168,0" fill="none" stroke="#8fd3ff" stroke-width="18" stroke-opacity="0.35"/>
    </g>

    <g>
      <g class="sun-spin" stroke="#ffcf56" stroke-width="6" stroke-linecap="round">
        <line x1="86" y1="22" x2="86" y2="34"/>
        <line x1="86" y1="118" x2="86" y2="130"/>
        <line x1="32" y1="76" x2="44" y2="76"/>
        <line x1="128" y1="76" x2="140" y2="76"/>

function pcmToWavUrl(b64, sampleRate) {
  var bin = atob(b64);
  var len = bin.length;
  var buf = new ArrayBuffer(44 + len);
  var view = new DataView(buf);
  function writeStr(off, s) { for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + len, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, len, true);
  var out = new Uint8Array(buf, 44);
  for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

function getApiKey() {
  return (GEMINI_API_KEY || localStorage.getItem("bimba_gemini_key") || "").trim();
}

async function fetchCuteTTS(text, lang) {
  var key = lang + ":" + text;
  if (ttsCache[key]) return ttsCache[key];
  var apiKey = getApiKey();
  var promptText = lang === "en-US"
    ? "Say this English word clearly with a very cute, sweet, cheerful young girl cartoon mascot voice for little kids: " + text
    : "Ucapkan kalimat Bahasa Indonesia berikut dengan suara kakak perempuan muda yang sangat imut, ceria, lembut, antusias, dan menggemaskan seperti pembimbing PAUD/TK kepada anak-anak: " + text;

  try {
    var res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=" + encodeURIComponent(apiKey), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: "Leda" }
            }
          }
        }
      })
    });
    if (!res.ok) return null;
    var data = await res.json();
    var part = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0];
    var inline = part && part.inlineData;
    if (!inline || !inline.data) return null;
    var rateMatch = (inline.mimeType || "").match(/rate=(\d+)/);
    var rate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
    var url = pcmToWavUrl(inline.data, rate);
    ttsCache[key] = url;
    return url;
  } catch (e) {
    return null;
  }
}

function stopVoice() {
  try { player.pause(); player.currentTime = 0; } catch (e) {}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  setTalk(0);
}

function speakFallback(clean, lang, id, onDone) {
  try {
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = lang || "id-ID";
    u.rate = 0.96;
    u.pitch = 1.48;
    var vs = speechSynthesis.getVoices();
    var v = vs.find(function(x) { return x.lang.indexOf(lang.slice(0, 2)) === 0 && /female|perempuan|gadis|siti|damayanti|google/i.test(x.name); }) ||
            vs.find(function(x) { return x.lang.indexOf(lang.slice(0, 2)) === 0; });
    if (v) u.voice = v;
    u.onend = u.onerror = function() {
      if (id === spk) setTalk(0);
      if (onDone) onDone();
    };
    setTalk(1);
    speechSynthesis.speak(u);
  } catch (e) {
    setTalk(1);
    setTimeout(function() { if (id === spk) setTalk(0); if (onDone) onDone(); }, 1300);
  }
}

async function say(t, l, keep, onDone) {
  var clean = (t || "").replace(/[^\p{L}\p{N}\s.,!?+\-]/gu, "").trim();
  if (!clean) { if (onDone) onDone(); return; }
  if (!keep) stopVoice();
  var id = ++spk;
  var lang = l || "id-ID";

  setTalk(1);
  var url = await fetchCuteTTS(clean, lang);
  if (id !== spk) return;

  if (url) {
    player.src = url;
    player.onended = player.onerror = function() {
      if (id === spk) setTalk(0);
      if (onDone) onDone();
    };
    try {
      await player.play();
      return;
    } catch (err) {}
  }
  speakFallback(clean, lang, id, onDone);
}

    WR = [["🍎", "🔴"], ["🍌", "🟡"], ["🥒", "🟢"], ["🐳", "🔵"]],
    NU = [["1", "🎈"], ["2", "🐟🐟"], ["3", "🍎🍎🍎"], ["4", "⭐⭐⭐⭐"], ["5", "🍌🍌🍌🍌🍌"]],
    HU = [["🍌", "P"], ["🐟", "I"], ["🐱", "K"], ["🐘", "G"], ["🍎", "A"]];
var RR = [
  [{ t: "Pasangkan hewan dengan makanannya", p: HF.slice(0, 3) }, { t: "Pasangkan gambar dengan warnanya", p: WR.slice(0, 3) }],
  [{ t: "Pasangkan hewan dengan makanannya", p: HF }, { t: "Pasangkan angka dengan jumlah gambar", p: NU.slice(0, 3) }],
  [{ t: "Pasangkan hewan dengan makanannya", p: HF }, { t: "Pasangkan angka dengan jumlah gambar", p: NU.slice(0, 4) }, { t: "Pasangkan gambar dengan warnanya", p: WR }],
  [{ t: "Pasangkan angka dengan jumlah gambar", p: NU }, { t: "Pasangkan gambar dengan huruf depannya", p: HU }, { t: "Pasangkan hewan dengan makanannya", p: HF }]
];

function mstart() {
  R = RR[D.b - 1];
  G.match.m = R.reduce(function(a, r) { return a + r.p.length; }, 0);
  mr = 0; msc = 0;
  view("v5");
  mround();
}

function mround() {
  var r = R[mr], z = "", d = "";
  mdone = 0;
  $("mpb").style.width = (mr / R.length * 100) + "%";
  $("mt").textContent = r.t;
  bub("Geser gambarnya ke pasangannya ya! (" + (mr + 1) + "/" + R.length + ")", 0, 1);
  say(r.t, "id-ID");
  r.p.forEach(function(p, i) { z += '<div class="zone" data-i="' + i + '">' + p[1] + '</div>'; });
  shuffle(r.p.map(function(p, i) { return i; })).forEach(function(i) { d += '<div class="drag" data-i="' + i + '">' + r.p[i][0] + '</div>'; });
  $("zones").innerHTML = z;
  $("tray").innerHTML = d;
  $("tray").querySelectorAll(".drag").forEach(drag);
}

function drag(el) {
  el.onpointerdown = function(e) {
    e.preventDefault();
    snd.pop();
    var sx = e.clientX, sy = e.clientY;
    el.classList.add("up");
    el.style.transition = "none";
    function mv(ev) { el.style.transform = "translate(" + (ev.clientX - sx) + "px," + (ev.clientY - sy) + "px) scale(1.15)"; }
    function up(ev) {
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      el.style.pointerEvents = "none";
      var t = document.elementFromPoint(ev.clientX, ev.clientY);
      el.style.pointerEvents = "";
      var z = t && t.closest ? t.closest(".zone") : null;
      el.classList.remove("up");
      el.style.transition = "";
      if (z && !z.classList.contains("ok") && z.dataset.i === el.dataset.i) {
        z.classList.add("ok");
        z.appendChild(el);
        el.style.transform = "";
        el.onpointerdown = null;
        el.classList.add("placed");
        if (!el.dataset.err) msc++;
        snd.ok();
        confetti.burst(28);
        bub(["Hebat! 🎉", "Pintar! ⭐", "Yeay, cocok! 👏"][mdone % 3]);
        if (++mdone === R[mr].p.length) setTimeout(function() { mr++; mr < R.length ? mround() : mfin(); }, 1200);
      } else {
        el.style.transform = "";
        if (z && !z.classList.contains("ok")) {
          el.dataset.err = 1;
          snd.no();
          bub("Belum cocok, coba lagi ya 💪");
        }
      }
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  };
}

function mfin() {
  P.match = msc;
  reward("match");
}

$("mback").onclick = function() {
  snd.pop();
  menu("Mau main yang lain?");
};
</script>
</body>
